# Publishes the operator's web (dashboard, cloud API) and hooks ports on the kind node.
apiVersion: v1
kind: Service
metadata:
  name: omp-operator-dev
  namespace: omp-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: omp-operator
    app.kubernetes.io/instance: omp
  ports:
    - {name: web, port: 8080, targetPort: 8080, nodePort: 30080}
    - {name: hooks, port: 8082, targetPort: 8082, nodePort: 30082}
