name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/techdufus/omp-operator
  RUNTIME_IMAGE: ghcr.io/techdufus/omp-operator-runtime
  CHART_REPO: oci://ghcr.io/techdufus/charts
  CHART_REF: ghcr.io/techdufus/charts/omp-operator

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: release tag matches the omp-cloud plugin version
        run: TAG="${GITHUB_REF_NAME}" mise run release:check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: helm registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.OPERATOR_IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/TechDufus/omp-operator

      - id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.RUNTIME_IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/TechDufus/omp-operator

      - name: sign images
        env:
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          cosign sign --yes "${OPERATOR_IMAGE}@${OPERATOR_DIGEST}"
          cosign sign --yes "${RUNTIME_IMAGE}@${RUNTIME_DIGEST}"

      - name: package, push and sign chart
        id: chart
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          helm package charts/omp-operator --version "${tag#v}" --app-version "${tag}" -d dist
          helm push "dist/omp-operator-${tag#v}.tgz" "${CHART_REPO}" 2>&1 | tee dist/push.log
          digest="$(sed -n 's/^Digest: *\(sha256:[0-9a-f]*\).*/\1/p' dist/push.log)"
          test -n "$digest"
          cosign sign --yes "${CHART_REF}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: summary
        env:
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "| Artifact | Digest |"
            echo "|---|---|"
            echo "| \`${OPERATOR_IMAGE}\` | \`${OPERATOR_DIGEST}\` |"
            echo "| \`${RUNTIME_IMAGE}\` | \`${RUNTIME_DIGEST}\` |"
            echo "| \`${CHART_REF}\` | \`${CHART_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes "dist/omp-operator-${GITHUB_REF_NAME#v}.tgz"
