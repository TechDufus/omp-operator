image:
  repository: ghcr.io/techdufus/omp-operator
  tag: "" # "" = the chart's appVersion
  digest: ""
  pullPolicy: IfNotPresent

# Also the default agent image (--default-runtime-image) and the image of the omp-auth gateway.
runtimeImage:
  repository: ghcr.io/techdufus/omp-operator-runtime
  tag: "" # "" = the chart's appVersion
  digest: ""

dashboard:
  url: ""
  oidc:
    issuerURL: ""
    clientID: ""
    clientSecret:
      existingSecret: ""
      key: client-secret
    scopes: [openid, email, profile, groups]
    usernameClaim: email
    groupsClaim: groups
  basic:
    existingSecret: "" # Secret with key "htpasswd" (bcrypt entries only)
  # Access rules, rendered into the access file as-is:
  #   - users: ["alice@example.com", "basic:ops"]
  #     groups: ["platform"]
  #     namespaces: ["*"]
  #     role: viewer
  access: []
  # Cloud API bearer tokens (see docs/reference/cloud-api.md). Each is {name, sha256} (hex sha256 of the token)
  # or {name, existingSecret, key} (key defaults to "token"); grant them in access rules as "token:<name>"
  # with role viewer or operator:
  #   apiTokens:
  #     - {name: laptop, existingSecret: omp-cloud-laptop}
  #   access:
  #     - {users: ["token:laptop"], namespaces: ["*"], role: operator}
  apiTokens: []

cloud:
  # Largest repository bundle the cloud API accepts, in bytes.
  maxUploadBytes: 1073741824

hooks:
  publicURL: ""

actions:
  # ["*"] lets actions target any namespace except the operator's.
  targetNamespaces: []

persistence:
  storageClass: ""
  size: 20Gi

authGateway:
  enabled: false
  clientsSecret: omp-auth-clients
  persistence:
    storageClass: ""
    size: 1Gi

rbac:
  # Namespaces the operator may manage agents in; empty means cluster-wide.
  agentNamespaces: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
