  name: ompsessions.omp.techdufus.com
spec:
  group: omp.techdufus.com
  names:
    kind: OmpSession
    listKind: OmpSessionList
    plural: ompsessions
    shortNames:
      - ompsession
    singular: ompsession
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.agentRef.name
          name: Agent
          type: string
        - jsonPath: .spec.triggerRef.name
          name: Trigger
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.verdict
          name: Verdict
          type: string
        - jsonPath: .status.title
          name: Title
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: OmpSession is the Schema for the ompsessions API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of OmpSession
              properties:
                agentRef:
                  description: agentRef is the OmpAgent that runs the session.
                  properties:
                    name:
                      description: name is the object name.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                continuityKey:
                  description: continuityKey makes sessions of one agent with the same key share omp history.
                  type: string
                event:
                  description: event describes the webhook event that created the session.
                  properties:
                    groupId:
                      description: groupId is the trigger group id.
                      type: string
                    key:
                      description: key is the event's grouping key.
                      type: string
                    name:
                      description: name is the event name.
                      type: string
                    severity:
                      description: severity is the event severity.
                      type: string
                  type: object
                priority:
                  description: priority orders pending sessions of one agent, lower first. Empty means 1 (manual).
                  format: int32
                  maximum: 3
                  minimum: 0
                  type: integer
                prompt:
                  description: prompt is the text sent to omp.
                  minLength: 1
                  type: string
                triggerRef:
                  description: triggerRef is the OmpTrigger that created the session, if any.
                  properties:
                    name:
                      description: name is the object name.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
              required:
                - agentRef
                - prompt
              type: object
            status:
              description: status defines the observed state of OmpSession
              properties:
                actions:
                  description: actions records the action calls the agent made.
                  items:
                    description: ActionRecord is one action call made by the agent.
                    properties:
                      action:
                        description: action is the action's tool name.
                        type: string
                      at:
                        description: at is when the call was made.
                        format: date-time
                        type: string
                      ok:
                        description: ok is whether the call succeeded.
                        type: boolean
                      result:
                        description: result is the text returned to the agent.
                        maxLength: 300
                        type: string
                      target:
                        description: target describes what the call acted on.
                        type: string
                    required:
                      - action
                      - at
                      - ok
                    type: object
                  maxItems: 20
                  type: array
                attempts:
