                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                continuity:
                  description: continuity reports whether omp history was restored and stored.
                  properties:
                    restored:
                      description: restored is whether stored history was loaded.
                      type: boolean
                    stored:
                      description: stored is whether history was saved.
                      type: boolean
                  type: object
                error:
                  description: error describes why the session failed.
                  maxLength: 1000
                  type: string
                outcome:
                  description: outcome is how the latest attempt ended.
                  enum:
                    - completed
                    - retryable
                    - auth
                    - error
                  type: string
                phase:
                  description: phase is the lifecycle phase.
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                  type: string
                podName:
                  description: podName is the current or last pod.
                  type: string
                proposedCommands:
                  description: proposedCommands are commands the agent suggests an owner run.
                  items:
                    maxLength: 500
                    type: string
                  maxItems: 10
                  type: array
                retryAt:
                  description: retryAt is when a retryable attempt may run again.
                  format: date-time
                  type: string
                startTime:
                  description: startTime is when the first attempt started.
                  format: date-time
                  type: string
                summary:
                  description: summary is the agent's summary.
                  maxLength: 3000
                  type: string
                title:
                  description: title is the agent's one-line title.
                  maxLength: 80
                  type: string
                usage:
                  description: usage is the token and cost accounting.
                  properties:
                    cacheReadTokens:
                      description: cacheReadTokens is the cache-read tokens used.
                      format: int64
                      type: integer
                    cacheWriteTokens:
                      description: cacheWriteTokens is the cache-write tokens used.
                      format: int64
                      type: integer
                    cost:
                      description: cost is the cost as a decimal string.
                      type: string
                    inputTokens:
                      description: inputTokens is the input tokens used.
                      format: int64
                      type: integer
                    outputTokens:
                      description: outputTokens is the output tokens used.
                      format: int64
                      type: integer
                  type: object
                verdict:
                  description: verdict is the agent's reported result.
                  enum:
                    - ok
                    - fixed
                    - needs_owner
                    - inconclusive
                  type: string
                workspaceRevision:
                  description: workspaceRevision is the revision the workspace was prepared from.
                  type: string
              type: object
