apiVersion: v1
kind: Service
metadata:
  name: omp-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omp-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "omp-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: 8080
      targetPort: web
    - name: hooks
      port: 8082
      targetPort: hooks
    - name: agent
      port: 8083
      targetPort: agent
    - name: metrics
      port: 9090
      targetPort: metrics
