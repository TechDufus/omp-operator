apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omp-operator.managerRoleName" . }}
  labels:
    {{- include "omp-operator.labels" . | nindent 4 }}
rules: {{ .Files.Get "files/rules.yaml" | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omp-operator.managerRoleName" . }}
  labels:
    {{- include "omp-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "omp-operator.managerRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: omp-operator
    namespace: {{ .Release.Namespace }}
