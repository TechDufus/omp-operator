[tools]
"aqua:kubernetes-sigs/kubebuilder" = "4.16.0"
bun = "1.4.3"
go = "1.27.2"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
helm = "4.3.0"
kind = "0.33.0"
kubectl = "1.37.1"
yq = "4.54.1"

[env]
OMP_VERSION = "v18.12.2"

[tasks.generate]
description = "Generate DeepCopy methods"
run = 'go tool controller-gen object:headerFile="hack/boilerplate.go.txt",year=2026 paths="./..."'

[tasks.manifests]
description = "Generate CRDs and the manager ClusterRole"
depends = ["generate"]
run = 'go tool controller-gen rbac:roleName=manager-role crd paths="./..." output:crd:artifacts:config=config/crd/bases'

[tasks.chart-sync]
description = "Copy generated CRDs and RBAC rules into the Helm chart"
depends = ["manifests"]
shell = "bash -c"
run = '''
set -euo pipefail
rm -rf charts/omp-operator/crds
mkdir -p charts/omp-operator/crds charts/omp-operator/files
for f in config/crd/bases/*.yaml; do
  yq '.' "$f" > "charts/omp-operator/crds/$(basename "$f")"
done
yq '.rules' config/rbac/role.yaml > charts/omp-operator/files/rules.yaml
'''

[tasks.verify-generated]
description = "Fail when generated files differ from the committed ones"
depends = ["chart-sync"]
shell = "bash -c"
run = '''
set -euo pipefail
out="$(git status --porcelain)"
if [ -n "$out" ]; then
  echo "generated files are out of date:" >&2
  echo "$out" >&2
  git --no-pager diff --stat >&2
  exit 1
fi
'''

[tasks.lint]
description = "Run golangci-lint"
depends = ["generate"]
run = "golangci-lint run"

[tasks.test]
description = "Run go vet and unit, envtest and chart tests"
depends = ["manifests"]
shell = "bash -c"
run = '''
set -euo pipefail
go vet ./...
minor="$(go list -m k8s.io/api | cut -d' ' -f2 | cut -d. -f2)"
KUBEBUILDER_ASSETS="$(go tool setup-envtest use "1.${minor}" --bin-dir "$PWD/bin" -p path)"
export KUBEBUILDER_ASSETS
go test $(go list ./... | grep -v -e /test/e2e -e /test/ompcompat) -coverprofile cover.out
'''

[tasks.ci]
description = "Lint, test and lint the chart"
depends = ["lint", "test", "chart-sync", "client:test", "client:typecheck", "release:check"]
run = "helm lint charts/omp-operator"

[tasks."client:deps"]
description = "Install the omp-cloud extension's dev dependencies (frozen lockfile)"
dir = "clients/omp-cloud"
run = "bun install --frozen-lockfile"

[tasks."client:test"]
description = "Run the omp-cloud extension's bun tests"
depends = ["client:deps"]
dir = "clients/omp-cloud"
run = "bun test"

[tasks."client:typecheck"]
description = "Typecheck the omp-cloud extension"
depends = ["client:deps"]
dir = "clients/omp-cloud"
run = "bunx tsc --noEmit -p ."

[tasks."release:check"]
description = "Fail unless the omp-cloud plugin version, its marketplace entry and (with TAG=vX.Y.Z) the release tag agree"
shell = "bash -c"
run = '''
set -euo pipefail
catalog=.omp-plugin/marketplace.json
pkg="$(yq -p json -o yaml '.version' clients/omp-cloud/package.json)"
ver="$(yq -p json -o yaml '.plugins[] | select(.name == "omp-cloud") | .version' "$catalog")"
ref="$(yq -p json -o yaml '.plugins[] | select(.name == "omp-cloud") | .source.ref' "$catalog")"
fail=0
[ "$ver" = "$pkg" ] || { echo "$catalog: omp-cloud version $ver != clients/omp-cloud/package.json $pkg" >&2; fail=1; }
[ "$ref" = "v$pkg" ] || { echo "$catalog: omp-cloud source.ref $ref != v$pkg" >&2; fail=1; }
if [ -n "${TAG:-}" ] && [ "$TAG" != "v$pkg" ]; then
  echo "tag $TAG != plugin version v$pkg; run mise run release:bump ${TAG#v} and commit before tagging" >&2
  fail=1
fi
exit "$fail"
'''

[tasks."release:bump"]
description = "Set the release version: omp-cloud package.json, its marketplace entry (version and tag ref) and the docs' chart version"
usage = 'arg "<version>" help="the new version without v, e.g. 0.3.0"'
shell = "bash -c"
run = '''
set -euo pipefail
new="${usage_version}"
[[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got $new" >&2; exit 2; }
old="$(yq -p json -o yaml '.version' clients/omp-cloud/package.json)"
[ "$new" != "$old" ] || { echo "already at $new" >&2; exit 1; }
oldre="${old//./\\.}"
sed -i "0,/\"version\": \"$oldre\"/s//\"version\": \"$new\"/" clients/omp-cloud/package.json
NEW="$new" yq -i -p json -o json \
  '(.plugins[] | select(.name == "omp-cloud")) |= (.version = strenv(NEW) | .source.ref = "v" + strenv(NEW))' \
  .omp-plugin/marketplace.json
for f in README.md docs/*.md; do
  sed -i -e "s/--version $oldre\b/--version $new/g" \
    -e "s/\`v$oldre\` for chart \`$oldre\`/\`v$new\` for chart \`$new\`/g" "$f"
done
mise run release:check
echo "bumped $old -> $new; commit, then: git tag -s v$new -m v$new && git push --atomic origin main v$new"
'''

[tasks.build]
description = "Build the manager and the in-pod driver"
depends = ["generate"]
run = [
  "go build -o bin/manager ./cmd",
  "go build -o bin/omp-operator-driver ./cmd/driver",
]

[tasks.run]
description = "Run the manager against the current kubeconfig"
depends = ["manifests"]
run = "go run ./cmd"

[tasks.docker-build]
description = "Build the controller image"
run = 'docker build -t "${IMG:-omp-operator:dev}" .'

[tasks.docker-build-runtime]
description = "Build the agent runtime image"
run = 'docker build -f images/runtime/Dockerfile -t "${RUNTIME_IMG:-omp-operator-runtime:dev}" .'

[tasks.docker-build-e2e]
description = "Build the e2e runtime image (driver + fake omp)"
run = 'docker build -f images/e2e/Dockerfile -t "${E2E_IMG:-omp-operator-e2e:dev}" .'

[tasks."omp:download"]
description = "Download the pinned omp release into bin/omp-linux-x64 (checksum-verified)"
shell = "bash -c"
run = '''
set -euo pipefail
mkdir -p bin
base="https://github.com/can1357/oh-my-pi/releases/download/${OMP_VERSION}"
if [ ! -x bin/omp-linux-x64 ] || [ "$(cat bin/omp-linux-x64.version 2>/dev/null)" != "$OMP_VERSION" ]; then
  curl -fsSL -o bin/omp-linux-x64 "$base/omp-linux-x64"
  curl -fsSL -o bin/omp-SHA256SUMS.txt "$base/SHA256SUMS.txt"
  (cd bin && grep ' omp-linux-x64$' omp-SHA256SUMS.txt | sha256sum -c -)
  chmod +x bin/omp-linux-x64
  echo "$OMP_VERSION" > bin/omp-linux-x64.version
fi
'''

[tasks.ompcompat]
description = "Run compatibility tests against the pinned real omp"
depends = ["omp:download"]
shell = "bash -c"
run = '''
set -euo pipefail
OMP_BIN="$PWD/bin/omp-linux-x64" go test -tags ompcompat ./test/ompcompat/ -v -count=1
'''

[tasks.test-e2e]
description = "Run the e2e suite on a kind cluster"
depends = ["omp:download", "docker-build", "docker-build-e2e"]
shell = "bash -c"
run = '''
set -euo pipefail
export IMG="${IMG:-omp-operator:dev}"
export E2E_IMG="${E2E_IMG:-omp-operator-e2e:dev}"
export OMP_BIN="$PWD/bin/omp-linux-x64"
export KIND_CLUSTER=omp-operator-e2e
# A dedicated kubeconfig: kind create/delete must never touch ~/.kube/config.
mkdir -p bin
export KUBECONFIG="$PWD/bin/$KIND_CLUSTER.kubeconfig"
if kind get clusters | grep -qx "$KIND_CLUSTER"; then
  kind export kubeconfig --name "$KIND_CLUSTER"
else
  kind create cluster --name "$KIND_CLUSTER"
fi
trap 'kind delete cluster --name "$KIND_CLUSTER"; rm -f "$KUBECONFIG"' EXIT
go test -tags e2e ./test/e2e/ -v -ginkgo.v -timeout 30m
'''

[tasks."dev:up"]
description = "Create or update the long-lived kind dev cluster omp-dev (idempotent)"
shell = "bash -c"
run = '''
set -euo pipefail
export KUBECONFIG="$PWD/bin/dev/kubeconfig"
mkdir -p bin/dev
if ! kind get clusters | grep -qx omp-dev; then
  kind create cluster --config hack/dev/kind.yaml
else
  kind export kubeconfig --name omp-dev
fi
TAG="dev-$(date +%s)"
docker build -q -t "omp-operator:$TAG" .
docker build -q -f images/runtime/Dockerfile -t "omp-operator-runtime:$TAG" .
docker build -q -f images/e2e/Dockerfile -t "omp-operator-e2e:$TAG" .
kind load docker-image --name omp-dev "omp-operator:$TAG" "omp-operator-runtime:$TAG" "omp-operator-e2e:$TAG"
echo "$TAG" > bin/dev/tag
umask 077
[ -s bin/dev/password ] || head -c 18 /dev/urandom | base64 | tr '+/' '-_' > bin/dev/password
[ -s bin/dev/token ] || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > bin/dev/token
chmod 0600 bin/dev/password bin/dev/token
umask 022
for ns in omp-system omp-dev; do
  kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
done
go run ./hack/dev/htpasswd dev bin/dev/password \
  | kubectl -n omp-system create secret generic omp-dev-basic --from-file=htpasswd=/dev/stdin --dry-run=client -o yaml \
  | kubectl apply -f -
kubectl -n omp-system create secret generic omp-dev-token --from-file=token=bin/dev/token --dry-run=client -o yaml \
  | kubectl apply -f -
# Helm installs crds/ only on first install; apply them every time so API changes land.
kubectl apply --server-side --force-conflicts -f charts/omp-operator/crds
helm upgrade --install omp charts/omp-operator -n omp-system -f hack/dev/values.yaml \
  --set image.repository=omp-operator --set image.tag="$TAG" \
  --set runtimeImage.repository=omp-operator-runtime --set runtimeImage.tag="$TAG" \
  --wait --timeout 5m
for f in hack/dev/*.yaml; do
  case "$(basename "$f")" in kind.yaml|values.yaml) continue ;; esac
  sed "s/__DEV_TAG__/$TAG/" "$f" | kubectl apply -f -
done
docker exec omp-dev-control-plane crictl rmi --prune >/dev/null || true
echo
echo "dashboard: http://127.0.0.1:30080 (user dev)"
echo "password:  $PWD/bin/dev/password"
echo "token:     $PWD/bin/dev/token"
echo "kubeconfig: $KUBECONFIG"
'''

[tasks."dev:login"]
description = "Log the dev cluster's auth gateway in to a provider: anthropic (default) or openai-codex"
shell = "bash -c"
usage = 'arg "[provider]" default="anthropic" help="anthropic or openai-codex"'
run = '''
set -euo pipefail
export KUBECONFIG="$PWD/bin/dev/kubeconfig"
provider="${usage_provider:-anthropic}"
case "$provider" in
  anthropic) port=54545 ;;
  openai-codex) port=1455 ;;
  *) echo "unknown provider $provider (anthropic or openai-codex)" >&2; exit 2 ;;
esac
kubectl -n omp-system port-forward deploy/omp-auth "$port:$port" >/dev/null &
pf=$!
trap 'kill $pf 2>/dev/null || true' EXIT
kubectl -n omp-system exec -it deploy/omp-auth -c gateway -- omp auth-broker login "$provider"
kubectl -n omp-system rollout restart deploy/omp-auth
kubectl -n omp-system rollout status deploy/omp-auth --timeout 5m
'''

[tasks."dev:status"]
description = "Show the dev cluster's operator pods, agents, triggers, sessions and threads"
shell = "bash -c"
run = '''
set -euo pipefail
export KUBECONFIG="$PWD/bin/dev/kubeconfig"
kubectl get pods -n omp-system
kubectl get ompagents,omptriggers,ompsessions,ompthreads -A
echo
echo "dashboard: http://127.0.0.1:30080 (user dev)"
echo "webhooks:  http://127.0.0.1:30082"
echo "password:  $PWD/bin/dev/password"
echo "token:     $PWD/bin/dev/token"
'''

[tasks."dev:github-token"]
description = "Store your gh token as Secret omp-dev/github-token (cloud git push to github.com); no docker needed"
shell = "bash -c"
run = '''
set -euo pipefail
export KUBECONFIG="$PWD/bin/dev/kubeconfig"
gh auth token \
  | kubectl -n omp-dev create secret generic github-token --from-file=token=/dev/stdin --dry-run=client -o yaml \
  | kubectl apply -f -
'''

[tasks."dev:client"]
description = "Point your local omp at the dev cluster: link the omp-cloud extension and write ~/.omp/agent/cloud.json"
shell = "bash -c"
run = '''
set -euo pipefail
agent_dir="${PI_CODING_AGENT_DIR:-$HOME/.omp/agent}"
# The marketplace plugin and this link would both register /cloud; only one copy may be installed.
if command -v omp >/dev/null && omp plugin list 2>/dev/null | grep -q 'omp-cloud@'; then
  echo "the omp-cloud marketplace plugin is installed; run omp plugin uninstall omp-cloud@omp-operator first" >&2
  exit 1
fi
mkdir -p "$agent_dir/extensions"
link="$agent_dir/extensions/omp-cloud"
target="$PWD/clients/omp-cloud"
if [ -L "$link" ] || [ -e "$link" ]; then
  if [ "$(readlink "$link")" != "$target" ]; then
    echo "$link exists and does not point at $target; remove it first" >&2
    exit 1
  fi
else
  ln -s "$target" "$link"
fi
url="http://127.0.0.1:30080"
cfg="$agent_dir/cloud.json"
if [ -e "$cfg" ]; then
  have="$(yq -p json -o json '.url // ""' "$cfg" | tr -d '"')"
  if [ "$have" != "$url" ]; then
    echo "$cfg points at $have; to use the dev cluster set this line in it:" >&2
    echo "  \"url\": \"$url\"," >&2
    exit 1
  fi
fi
umask 077
printf '{"url":"%s","tokenCommand":["cat","%s"],"namespace":"omp-dev","agent":"coder","excludeExtensions":["herd.ts","herdr-omp-agent-state.ts"]}\n' \
  "$url" "$PWD/bin/dev/token" > "$cfg"
chmod 0600 "$cfg"
echo "linked $link -> $target"
echo "wrote $cfg"
'''

[tasks."dev:down"]
description = "Delete the dev cluster and its local files"
shell = "bash -c"
run = '''
set -euo pipefail
export KUBECONFIG="$PWD/bin/dev/kubeconfig"
kind delete cluster --name omp-dev
rm -rf bin/dev
'''
