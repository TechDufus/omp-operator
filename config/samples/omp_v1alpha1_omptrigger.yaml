apiVersion: omp.techdufus.com/v1alpha1
kind: OmpTrigger
metadata:
  labels:
    app.kubernetes.io/name: omp-operator
  name: alertmanager
spec:
  agentRef:
    name: alert-triage
  session:
    resume: episode
  webhook:
    adapter: alertmanager
    auth:
      bearer:
        secretRef:
          name: triage-webhook
          key: token
    grouping:
      episodeGap: 30m
      retriageAfter: 1h
      perGroupPerDay: 2
  prompt: |
    Alertmanager group {{ .Event.Name }} is {{ .Event.Status }} with severity {{ .Event.Severity }}.
    Reason for this session: {{ .Reason }} ({{ .AlertCount }} alert(s)).

    Previous session summary for this group:
    {{ .Previous }}

    Alerts:
    {{ .Alerts }}
