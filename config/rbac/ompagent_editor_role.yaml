# This rule is not used by the project omp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the omp.techdufus.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: omp-operator
    app.kubernetes.io/managed-by: kustomize
  name: ompagent-editor-role
rules:
- apiGroups:
  - omp.techdufus.com
  resources:
  - ompagents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - omp.techdufus.com
  resources:
  - ompagents/status
  verbs:
  - get
